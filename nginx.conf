server {
    listen 80;
    server_name jmmasalaexports.com www.jmmasalaexports.com;
    return 301 https://jmmasalaexports.com$request_uri;
}

# One canonical host: www -> apex
server {
    listen 443 ssl http2;
    server_name www.jmmasalaexports.com;

    ssl_certificate /etc/letsencrypt/live/jmmasalaexports.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmmasalaexports.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://jmmasalaexports.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jmmasalaexports.com;

    root /usr/share/nginx/html;
    index index.html;

    # Replace with actual certificate files on server.
    ssl_certificate /etc/letsencrypt/live/jmmasalaexports.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmmasalaexports.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Old/alias URLs — real 301s instead of client-side redirects
    location = /oils      { return 301 /cold-pressed-oils; }
    location = /about     { return 301 /about-jm-masala; }
    location = /process   { return 301 /sourcing-network; }
    location = /get-quote { return 301 /contact?intent=quote; }

    # Trailing-slash variants -> canonical slashless URL
    location ~ ^(.+)/$ { return 301 $1; }

    # Every route is prerendered to <route>.html (scripts/prerender.mjs).
    # Anything else is a genuine 404, not a soft-404 SPA shell.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
