    default "";
    /oils                                  /cold-pressed-oils;
    /best-coriander-exporter-india         /coriander-seeds-exporter-india;
    /best-coriander-seeds-exporter-india   /coriander-seeds-exporter-india;
    /exports                               /export-destinations;
    /get-quote                             /contact?intent=quote;
    /about                                 /about-jm-masala;
    /process                               /spice-processing-manufacturing;
    /spice-processing                      /spice-processing-manufacturing;
    /coriander-seeds                       /coriander-seeds-exporter-india;
    /cumin-seeds                           /cumin-seeds-exporter-india;
    /fennel-seeds                          /fennel-seeds-exporter-india;
    /saunf                                 /fennel-seeds-exporter-india;
    /saunf-seeds                           /fennel-seeds-exporter-india;
    /fennel                                /fennel-seeds-exporter-india;
    /variyali                              /fennel-seeds-exporter-india;
    /fenugreek-seeds                       /fenugreek-seeds-exporter-india;
    /methi-seeds                           /fenugreek-seeds-exporter-india;
    /fenugreek                             /fenugreek-seeds-exporter-india;
    /methi                                 /fenugreek-seeds-exporter-india;
    /methi-dana                            /fenugreek-seeds-exporter-india;
    /ajwain                                /ajwain-seeds-exporter-india;
    /ajwain-seeds                          /ajwain-seeds-exporter-india;
    /carom-seeds                           /ajwain-seeds-exporter-india;
    /sesame-seeds                          /sesame-seeds-exporter-india;
    /natural-sesame-seeds                  /sesame-seeds-exporter-india;
    /hulled-sesame-seeds                   /sesame-seeds-exporter-india;
    /white-sesame-seeds                    /sesame-seeds-exporter-india;
    /til-seeds                             /sesame-seeds-exporter-india;
    /mustard-seeds                         /mustard-seeds-exporter-india;
    /mustard                               /mustard-seeds-exporter-india;
    /rai                                   /mustard-seeds-exporter-india;
    /sarson                                /mustard-seeds-exporter-india;
    /rai-seeds                             /mustard-seeds-exporter-india;
    /sarson-seeds                          /mustard-seeds-exporter-india;
    /turmeric                              /turmeric-exporter-india;
    /haldi                                 /turmeric-exporter-india;
    /turmeric-fingers                      /turmeric-exporter-india;
    /turmeric-powder                       /turmeric-exporter-india;
    /dry-ginger                            /dry-ginger-exporter-india;
    /red-chilli                            /red-chilli-exporter-india;
    /chilli                                /red-chilli-exporter-india;
    /dry-red-chilli                        /red-chilli-exporter-india;
    /lal-mirch                             /red-chilli-exporter-india;
    /teja-chilli                           /teja-chilli-exporter-india;
    /bird-eye-chilli                       /bird-eye-chilli-exporter-india;
    /king-chilli                           /king-chilli-exporter-india;
    /bhut-jolokia                          /king-chilli-exporter-india;
