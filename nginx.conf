# Anything reaching port 80 (either host) goes to the canonical https host.
server {
    listen 80;
    server_name jmmasalaexports.com www.jmmasalaexports.com;
    return 301 https://jmmasalaexports.com$request_uri;
}

# www -> apex. NOTE: the certificate must cover www.jmmasalaexports.com as well,
# otherwise browsers show a certificate warning before this redirect happens.
server {
    listen 443 ssl;
    http2 on;
    server_name www.jmmasalaexports.com;

    ssl_certificate /etc/letsencrypt/live/jmmasalaexports.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmmasalaexports.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://jmmasalaexports.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jmmasalaexports.com;

    root /usr/share/nginx/html;
    index index.html;

    # Never emit absolute redirects with the container's internal host/port.
    absolute_redirect off;

    # Replace with actual certificate files on server.
    ssl_certificate /etc/letsencrypt/live/jmmasalaexports.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmmasalaexports.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Real 404 using the prerendered dist/404.html (noindex).
    error_page 404 /404.html;

    # NOTE: add_header in a location replaces inherited server-level add_header
    # directives, so the security headers are repeated in every location below.

    # /products/ -> /products (canonical URLs have no trailing slash).
    # rewrite keeps the query string.
    rewrite ^/(.+)/$ /$1 permanent;

    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed build output only: safe to cache for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Other static files (not content-hashed): short cache. A missing file is a
    # real 404, never the SPA fallback. Includes /JMMasalaProducts.pdf.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|pdf)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location / {
        if ($redirect_target) {
            return 301 $redirect_target;
        }

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Enable only after HTTPS is confirmed working on the live host
        # (browsers will refuse plain http for the max-age afterwards):
        # add_header Strict-Transport-Security "max-age=31536000" always;

        # /products is served from dist/products/index.html with 200, no redirect.
        try_files $uri $uri.html $uri/index.html =404;
    }
}
